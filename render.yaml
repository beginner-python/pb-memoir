# Render Blueprint。バックエンド(FastAPI)をステージングと本番の 2 サービスとして定義する。
#   ステージング: main ブランチ  → pb-memoir-staging
#   本番:         release ブランチ → pb-memoir(タグ v* を打つと GitHub Actions が release を進める)
# 秘密情報(DATABASE_URL など)はダッシュボードで設定する(sync: false)。
services:
  - type: web
    name: pb-memoir-staging
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: UV_VERSION
        value: 0.9.17
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: READ_ONLY
        value: "true"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: TIMEZONE
        value: Asia/Tokyo
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: pb-memoir
    runtime: python
    plan: free
    region: singapore
    branch: release
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: UV_VERSION
        value: 0.9.17
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: READ_ONLY
        value: "true"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: TIMEZONE
        value: Asia/Tokyo
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
