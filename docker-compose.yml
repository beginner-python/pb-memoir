# ローカル開発環境。3 サービスとも `docker compose up` で起動し、ソース変更はホットリロードされる。
# 本番(Vercel / Render / Supabase)はコンテナを使わない。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memoir
    ports:
      - "5434:5432"   # ホストから psql / alembic を使うとき用(5432, 5433 は他プロジェクトが使用)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memoir"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    environment:
      # backend/.env の値より環境変数が優先される。コンテナ内では db ホスト名で接続する
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/memoir
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # ホストの node_modules(macOS 用バイナリ)と分離
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
