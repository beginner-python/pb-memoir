# ローカル開発環境。3 サービスとも `docker compose up` で起動し、ソース変更はホットリロードされる。
# 本番(Vercel / Render / Supabase)はコンテナを使わない。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memoir
    ports:
      - "5434:5432"   # ホストから psql / alembic を使うとき用(5432, 5433 は他プロジェクトが使用)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memoir"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    environment:
      # backend/.env の値より環境変数が優先される。コンテナ内では db ホスト名で接続する
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/memoir
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # ホストの node_modules(macOS 用バイナリ)と分離
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ---- E2E テスト用の独立したスタック(--profile e2e のときだけ) ----------------------
  # 開発用 DB には触れず、使い捨ての DB にサンプル日記を投入した状態でテストする。
  #   実行:   docker compose --profile e2e run --rm e2e
  #   片付け: docker compose rm -sf db-e2e backend-e2e frontend-e2e
  db-e2e:
    image: pgvector/pgvector:pg16
    profiles: ["e2e"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memoir_e2e
    tmpfs:
      - /var/lib/postgresql/data   # 永続化しない。コンテナを消せば消える
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memoir_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-e2e:
    build: ./backend
    profiles: ["e2e"]
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run python -m scripts.seed --reset --yes &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-e2e:5432/memoir_e2e
      LLM_PROVIDER: mock          # API を呼ばない。backend/.env の値より優先される
      READ_ONLY: "false"
      APP_ENV: local
    ports:
      - "8001:8000"               # デバッグ用
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      db-e2e:
        condition: service_healthy

  frontend-e2e:
    build: ./frontend
    profiles: ["e2e"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://backend-e2e:8000
      NEXT_DIST_DIR: .next-e2e    # 開発用フロントの .next と衝突させない
    ports:
      - "3001:3000"               # デバッグ用
    depends_on:
      backend-e2e:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble   # @playwright/test と同じバージョンにする
    profiles: ["e2e"]
    working_dir: /app
    # smoke プロジェクトはステージング向け(READ_ONLY=true 前提)なので除く
    command: npx playwright test --project=desktop --project=mobile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      E2E_BASE_URL: http://frontend-e2e:3000
      CI: "${CI:-}"
    depends_on:
      frontend-e2e:
        condition: service_started

volumes:
  pgdata:
  frontend_node_modules:
